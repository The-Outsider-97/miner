[project]
name = "slai-harnyx-miner"
version = "0.1.0"
description = "Engineering environment for SLAI-powered Harnyx SN67 miner artifacts and benchmarks."
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.26,<5",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the full SLAI runtime/dependency environment",
  "harnyx: requires the pinned Harnyx uv environment and official tooling",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
