name: Miner backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned upstream sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Miner test environment
        run: uv sync --group dev

      - name: Verify no tracked secret material
        shell: bash
        run: |
          tracked="$(git ls-files | grep -vE '(^|/)\.env\.example$' || true)"
          if printf '%s\n' "$tracked" | grep -E '(^|/)\.env($|\.)|(^|/)(wallets|credentials|secrets)/|\.(pem|key|p12|pfx)$'; then
            echo "Tracked credential-like file detected"
            exit 1
          fi

      - name: Lint backend
        run: uv run ruff check artifact_builder.py benchmark_store.py dashboard_api.py slai_miner.py adapters utils tests

      - name: Compile backend and artifacts
        run: uv run python -m compileall -q artifact_builder.py benchmark_store.py dashboard_api.py slai_miner.py adapters utils artifacts/harnyx tests

      - name: Run credential-free tests
        run: uv run pytest -q -m "not integration and not harnyx"

      - name: Smoke dashboard bridge
        run: uv run python dashboard_api.py --json

      - name: Exercise deterministic artifact builder
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          uv run python artifact_builder.py b3 --output "$tmpdir/one.py"
          first="$(sha256sum "$tmpdir/one.py" | cut -d' ' -f1)"
          uv run python artifact_builder.py b3 --output "$tmpdir/two.py"
          second="$(sha256sum "$tmpdir/two.py" | cut -d' ' -f1)"
          test "$first" = "$second"
